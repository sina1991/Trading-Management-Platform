[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-management-platform"
version = "0.1.0"
description = "Independent modular-monolith foundation for managing multiple trading bots."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'", "eth-utils>=5.0,<6", "eth-hash[pycryptodome]>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
trading-platform = "trading_platform.cli:main"

[tool.setuptools.packages.find]
include = ["trading_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
